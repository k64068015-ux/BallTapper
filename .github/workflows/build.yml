name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project
        run: |
          mkdir -p BallTapper/app/src/main/java/com/example/balltapper BallTapper/app/src/main/res/xml
          cd BallTapper
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BallTapper"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.balltapper"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.balltapper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Ball Tapper"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".TapService"
                      android:exported="true"
                      android:label="Ball Tapper"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:description="@android:string/untitled" />
          EOF
          cat > app/src/main/java/com/example/balltapper/BallDetector.kt <<'EOF'
          package com.example.balltapper

          import android.graphics.Bitmap

          object BallDetector {
              data class Ball(val x: Float, val y: Float, val size: Float)

              // Ищем самое большое светлое пятно примерно квадратной формы (мяч с белым ободком)
              // на тёмном фоне. Текст тоже белый, но он вытянутый и отсеивается по пропорциям.
              fun find(src: Bitmap, scale: Int = 4): Ball? {
                  val w = src.width / scale
                  val h = src.height / scale
                  val small = Bitmap.createScaledBitmap(src, w, h, false)
                  val px = IntArray(w * h)
                  small.getPixels(px, 0, w, 0, 0, w, h)
                  if (small !== src) small.recycle()

                  val mask = BooleanArray(w * h)
                  for (i in px.indices) {
                      val c = px[i]
                      val r = (c shr 16) and 255
                      val g = (c shr 8) and 255
                      val b = c and 255
                      val mx = maxOf(r, g, b)
                      val mn = minOf(r, g, b)
                      mask[i] = r > 190 && g > 180 && b > 200 && (mx - mn) < 70
                  }

                  val visited = BooleanArray(w * h)
                  val queue = IntArray(w * h)
                  var best: Ball? = null
                  var bestArea = 0

                  for (start in px.indices) {
                      if (!mask[start] || visited[start]) continue
                      var head = 0
                      var tail = 0
                      queue[tail++] = start
                      visited[start] = true
                      var minX = w; var maxX = 0; var minY = h; var maxY = 0
                      var area = 0
                      while (head < tail) {
                          val p = queue[head++]
                          val x = p % w
                          val y = p / w
                          area++
                          if (x < minX) minX = x
                          if (x > maxX) maxX = x
                          if (y < minY) minY = y
                          if (y > maxY) maxY = y
                          if (x > 0 && mask[p - 1] && !visited[p - 1]) { visited[p - 1] = true; queue[tail++] = p - 1 }
                          if (x < w - 1 && mask[p + 1] && !visited[p + 1]) { visited[p + 1] = true; queue[tail++] = p + 1 }
                          if (y > 0 && mask[p - w] && !visited[p - w]) { visited[p - w] = true; queue[tail++] = p - w }
                          if (y < h - 1 && mask[p + w] && !visited[p + w]) { visited[p + w] = true; queue[tail++] = p + w }
                      }
                      val bw = maxX - minX + 1
                      val bh = maxY - minY + 1
                      val aspect = bw.toFloat() / bh
                      if (area >= 150 && bw >= 12 && aspect in 0.75f..1.33f && area > bestArea) {
                          bestArea = area
                          best = Ball(
                              x = (minX + maxX) / 2f * scale,
                              y = (minY + maxY) / 2f * scale,
                              size = maxOf(bw, bh) * scale.toFloat()
                          )
                      }
                  }
                  return best
              }
          }
          EOF
          cat > app/src/main/java/com/example/balltapper/TapService.kt <<'EOF'
          package com.example.balltapper

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class TapService : AccessibilityService() {

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onUnbind(intent: android.content.Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun tap(x: Float, y: Float) {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 30)
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }

              companion object {
                  @Volatile var instance: TapService? = null
              }
          }
          EOF
          cat > app/src/main/java/com/example/balltapper/CaptureService.kt <<'EOF'
          package com.example.balltapper

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder

          class CaptureService : Service() {

              private var projection: MediaProjection? = null
              private var reader: ImageReader? = null
              private var thread: HandlerThread? = null

              private var lastX = 0f
              private var lastY = 0f
              private var lastT = 0L
              private var lastTapT = 0L

              // Подстрой под свою игру
              private val latencyMs = 80f      // задержка захват -> тап
              private val cooldownMs = 150L    // не чаще одного тапа за это время

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startForegroundCompat()

                  val code = intent!!.getIntExtra("code", 0)
                  val data = intent.getParcelableExtra<Intent>("data")!!
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(code, data)
                  projection!!.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, null)

                  val dm = resources.displayMetrics
                  val w = dm.widthPixels
                  val h = dm.heightPixels

                  thread = HandlerThread("capture").also { it.start() }
                  val handler = Handler(thread!!.looper)

                  reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  projection!!.createVirtualDisplay(
                      "ballcap", w, h, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      reader!!.surface, null, handler
                  )

                  reader!!.setOnImageAvailableListener({ r ->
                      val img = r.acquireLatestImage() ?: return@setOnImageAvailableListener
                      try {
                          val plane = img.planes[0]
                          val rowPadding = plane.rowStride - plane.pixelStride * w
                          val bmp = Bitmap.createBitmap(
                              w + rowPadding / plane.pixelStride, h, Bitmap.Config.ARGB_8888
                          )
                          bmp.copyPixelsFromBuffer(plane.buffer)
                          val cropped = Bitmap.createBitmap(bmp, 0, 0, w, h)
                          process(cropped)
                          bmp.recycle()
                          cropped.recycle()
                      } finally {
                          img.close()
                      }
                  }, handler)

                  return START_NOT_STICKY
              }

              private fun process(bmp: Bitmap) {
                  val ball = BallDetector.find(bmp) ?: return
                  val now = System.currentTimeMillis()

                  // скорость по двум последним кадрам -> предсказание, где мяч будет к моменту тапа
                  var tx = ball.x
                  var ty = ball.y
                  if (lastT != 0L && now - lastT in 1..200) {
                      val dt = (now - lastT).toFloat()
                      tx += (ball.x - lastX) / dt * latencyMs
                      ty += (ball.y - lastY) / dt * latencyMs
                  }
                  lastX = ball.x; lastY = ball.y; lastT = now

                  if (now - lastTapT >= cooldownMs) {
                      TapService.instance?.tap(tx, ty)
                      lastTapT = now
                  }
              }

              private fun startForegroundCompat() {
                  val ch = "ballcap"
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(ch, "Ball Tapper", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(
                      this, 0, Intent(this, CaptureService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, ch)
                      .setContentTitle("Ball Tapper работает")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .addAction(Notification.Action.Builder(null, "Стоп", stop).build())
                      .build()
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
              }

              override fun onDestroy() {
                  reader?.close()
                  projection?.stop()
                  thread?.quitSafely()
                  super.onDestroy()
              }

              companion object {
                  const val ACTION_STOP = "stop"
              }
          }
          EOF
          cat > app/src/main/java/com/example/balltapper/MainActivity.kt <<'EOF'
          package com.example.balltapper

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                  }
                  root.addView(Button(this).apply {
                      text = "1. Включить службу доступности"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  root.addView(Button(this).apply {
                      text = "2. Запустить (захват экрана)"
                      setOnClickListener {
                          if (TapService.instance == null) {
                              Toast.makeText(this@MainActivity, "Сначала включи службу доступности", Toast.LENGTH_LONG).show()
                              return@setOnClickListener
                          }
                          val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                          startActivityForResult(mpm.createScreenCaptureIntent(), 100)
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Стоп"
                      setOnClickListener {
                          startService(Intent(this@MainActivity, CaptureService::class.java).setAction(CaptureService.ACTION_STOP))
                      }
                  })
                  setContentView(root)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 100 && resultCode == RESULT_OK && data != null) {
                      startForegroundService(
                          Intent(this, CaptureService::class.java)
                              .putExtra("code", resultCode)
                              .putExtra("data", data)
                      )
                      // свернуть приложение и перейти в игру
                      moveTaskToBack(true)
                  }
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle assembleDebug --no-daemon
        working-directory: BallTapper
      - uses: actions/upload-artifact@v4
        with:
          name: BallTapper-apk
          path: BallTapper/app/build/outputs/apk/debug/app-debug.apk
